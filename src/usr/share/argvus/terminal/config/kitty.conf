# ================= SHELL =================
shell /usr/bin/zsh

# ================= FONT =================
font_family      IBM Plex Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0
symbol_map       U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

# ================= WINDOW =================
# Theme colors (loaded from active theme)
include /usr/share/argvus/terminal/config/themes/argvus-dark/theme.conf
window_padding_width 5
confirm_os_window_close -1 count-background
wayland_titlebar_color background
remember_window_size no
initial_window_width  130c
initial_window_height 35c
window_margin_width 2

# Dead keys / composition
input_delay 0

linux_display_server wayland

# Use "yes" with Window Manager
hide_window_decorations no

# ================= SCROLL =================
scrollback_lines 100000
scrollback_pager_history_size 100000

# ================= CURSOR =================
shell_integration no-cursor
# Notify when a command running for 30 seconds or more finishes while its window is unfocused.
notify_on_cmd_finish unfocused 30.0 notify
# options: beam, underline and block
cursor_shape block
cursor_blink_interval 0.6
cursor_stop_blinking_after 15.0

# ================= TABS =================
# tab_title_template "tab {index}"
tab_title_template "{index}: {title}"
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style angled
tab_bar_min_tabs 1

# ================= SELECTION / HIGHLIGHT =================
copy_on_select yes
# color used by plugins like zsh-autosuggestions
url_color #1a8fff
url_style curly
detect_urls yes

# ===================== MOUSE =======================
# Right-click clipboard glue
mouse_map right press ungrabbed paste_from_clipboard

# ================= CURSOR COLORS =================

# ================= KEYBINDS GENERAL =================
map ctrl+shift+c copy_or_interrupt
map ctrl+shift+v paste_from_clipboard
map ctrl+q close_tab
map ctrl+alt+n new_tab_with_cwd
map f11 toggle_fullscreen
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map ctrl+tab     next_tab
map ctrl+shift+tab previous_tab

# ================= SPLITS =================
map ctrl+shift+d launch --location=hsplit --cwd=current
map ctrl+shift+s launch --location=vsplit --cwd=current
# Navigating between splits
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down
# Close current split
map ctrl+shift+x close_window
# Enable useful layouts
enabled_layouts tall,fat,grid,splits,stack

# ================= HISTORY =================
# Skip to previous/next prompt on scrollback
#map ctrl+shift+up   scroll_to_prompt -1
#map ctrl+shift+down scroll_to_prompt 1
# Select the output of the last command.
map ctrl+shift+o    select_cmd_output

# ================= HINTS =================
# Open URL on hover without mouse (shows clickable text)
map ctrl+shift+e open_url_with_hints
# Copy path/file as text
map ctrl+shift+p>f kitten hints --type path --program @
# Copy URL as text
map ctrl+shift+p>u kitten hints --type url  --program @

# ================= FONT SIZE =================
map ctrl+equal  change_font_size all +1.0
map ctrl+minus  change_font_size all -1.0
map ctrl+0      change_font_size all 0

# ================= PERFORMANCE =================
repaint_delay 10
input_delay 3
sync_to_monitor yes
