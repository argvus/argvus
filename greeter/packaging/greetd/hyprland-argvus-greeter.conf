# The greeter compositor must remain minimal: no user session config, effects,
# or wallpaper initialization may run before authentication.
# Minimal Hyprland configuration for Argvus Greeter.
# This intentionally avoids loading the user's full Argvus session before login.

# An empty monitor selector applies the preferred mode to the active output.
monitor=,preferred,auto,auto

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,argvus-greeter
env = XDG_SESSION_TYPE,wayland
env = GDK_BACKEND,wayland

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
}

decoration {
    rounding = 0
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

animations {
    enabled = false
}

input {
    kb_layout = us
    follow_mouse = 0
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(16, 18, 24)
    force_default_wallpaper = 0
}

exec-once = /usr/lib/argvus/commands/argvus-greeter-tui
