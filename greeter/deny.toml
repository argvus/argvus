# cargo-deny is intentionally strict about dependency provenance because the
# greeter runs before login and should have a small, auditable supply chain.
# cargo-deny policy for dependencies added to the workspace.

[advisories]
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "GPL-3.0-only",
  "MIT",
  "Unicode-3.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
