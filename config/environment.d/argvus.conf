# Argvus — environment for systemd user services.
#
# This file is read by the systemd user manager (systemd.environment.d) at
# login for EVERY user, so Qt services launched by systemd (hyprpolkitagent,
# xdg-desktop-portal, ...) get the Argvus theme without any ~/.config copy.
# The packaged location is /etc/environment.d/argvus.conf (system install).

# Qt apps native on Wayland, themed via qt6ct.
QT_QPA_PLATFORM=wayland
QT_QPA_PLATFORMTHEME=qt6ct
QT_QUICK_CONTROLS_STYLE=org.hyprland.style

# Let Qt/GTK (QSettings/GenericConfigLocation) fall back to packaged configs.
# This is what allows qt6ct to find /usr/share/argvus/qt6ct/qt6ct.conf for a
# brand-new user (and even copy it into ~/.config automatically).
XDG_CONFIG_DIRS=/usr/share/argvus:/etc/xdg

# Cursor for services started at login.
XCURSOR_THEME=Adwaita
XCURSOR_SIZE=24