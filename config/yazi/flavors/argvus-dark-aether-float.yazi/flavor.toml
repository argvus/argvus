# Argvus palette
# ---
# bg         "#111316"
# bg-2       "#1D1D23"
# ui         "#262933"
# ui-2       "#333647"
# ui-3       "#404552"
# tx-3       "#718994"
# tx-2       "#B0BFCB"
# tx         "#DFE5EA"
# red-400     "#4C3A3B" re
# orange-400  "#695B57" or
# yellow-400  "#B0BFCB" ye
# yellow-600  "#695B57" ye-2
# green-400   "#3590bd" gr
# cyan-400    "#3590bd" cy
# cyan-600    "#172D3D" cy-2
# cyan-700    "#172D3D" cy-700
# cyan-900    "#101C28" cy-900
# blue-400    "#3590bd" bl
# purple-400  "#627D8A" pu
# magenta-400 "#4C3A3B" ma

[app]
overall = { bg = "#111316" } # bg

[mgr]
cwd = { fg = "#DFE5EA", bold = true } # tx

# Find
find_keyword = { fg = "#3590bd", reversed = true } # cy
find_position = { fg = "#3590bd", bold = true, italic = true } # cy

# Marker
marker_copied = { fg = "#3590bd", bg = "#3590bd" } # gr, gr
marker_cut = { fg = "#4C3A3B", bg = "#4C3A3B" } # re, re
marker_marked = { fg = "#172D3D", bg = "#172D3D" } # cy-700, cy-700
marker_selected = { fg = "#3590bd", bg = "#3590bd" } # cy, cy

# Count
count_copied = { fg = "#3590bd", bold = true, reversed = true } # gr
count_cut = { fg = "#4C3A3B", bold = true, reversed = true } # re
count_selected = { fg = "#3590bd", bold = true, reversed = true } # cy

# Border
border_symbol = "│"
border_style = { fg = "#262933" } # ui

[indicator]
parent = { underline = true }
current = { fg = "#DFE5EA", bg = "#262933" } # tx, ui
preview = { underline = true }
padding = { open = "█", close = "█" }

[tabs]
active = { fg = "#DFE5EA", bg = "#404552", bold = true } # tx, ui-3
inactive = { fg = "#B0BFCB", bg = "#262933" } # tx-2, ui
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
# Normal mode
normal_main = { fg = "#DFE5EA", bg = "#404552", bold = true } # tx, ui-3
normal_alt = { fg = "#B0BFCB", bg = "#262933" } # tx-2, ui

# Select mode
select_main = { fg = "#111316", bg = "#3590bd", bold = true } # bg, cy
select_alt = { fg = "#3590bd", bg = "#101C28" } # cy, cy-900

# Unset mode
unset_main = { fg = "#111316", bg = "#3590bd", bold = true } # bg, cy
unset_alt = { fg = "#3590bd", bg = "#101C28" } # cy, cy-900

[status]
overall = { fg = "#DFE5EA" } # tx

# Permissions
perm_type = { fg = "#3590bd" } # bl
perm_read = { fg = "#B0BFCB" } # ye
perm_write = { fg = "#4C3A3B" } # re
perm_exec = { fg = "#3590bd" } # gr
perm_sep = { fg = "#B0BFCB" } # tx-2

# Progress
progress_label = { fg = "#111316" } # bg
progress_normal = { fg = "#3590bd", bg = "#172D3D" } # cy, cy-700
progress_error = { bg = "#4C3A3B" } # re

[which]
cols = 3
mask = { bg = "#1D1D23" } # bg-2
cand = { fg = "#3590bd", bold = true } # cy
rest = { fg = "#3590bd", italic = true } # cy
desc = { fg = "#718994" } # tx-3
separator = " "
separator_style = { }

[confirm]
border = { fg = "#404552" } # ui-3
title = { fg = "#718994", bold = true } # tx-3
body = { fg = "#DFE5EA", bold = true } # tx
list = { fg = "#DFE5EA" } # tx
btn_yes = { fg = "#DFE5EA", bg = "#404552", bold = true } # tx, ui-3
btn_no = { fg = "#B0BFCB", bg = "#262933" } # tx-2, ui

[spot]
border = { fg = "#404552" } # ui-3
title = { fg = "#718994", bold = true } # tx-3
tbl_col = { fg = "#B0BFCB" } # tx-2
tbl_cell = { fg = "#DFE5EA", bg = "#262933" } # tx, ui

[notify]
# Notification title
title_info = { fg = "#3590bd" } # bl
title_warn = { fg = "#695B57" } # or
title_error = { fg = "#4C3A3B" } # re

[pick]
border = { fg = "#404552", bold = true } # ui-3
active = { fg = "#DFE5EA" } # tx
inactive = { fg = "#B0BFCB" } # tx-2

[input]
border = { fg = "#404552" } # ui-3
title = { fg = "#718994", bold = true } # tx-3
value = { fg = "#DFE5EA" } # tx
selected = { bg = "#1D1D23" } # bg-2

[cmp]
border = { fg = "#404552", bold = true } # ui-3
active = { fg = "#DFE5EA", bg = "#262933" } # tx, ui
inactive = { fg = "#B0BFCB" } # tx-2

[tasks]
border = { fg = "#404552" } # ui-3
title = { fg = "#718994", bold = true } # tx-3
hovered = { fg = "#DFE5EA", bg = "#262933" } # tx, ui

[help]
on = { fg = "#3590bd" } # bl
run = { fg = "#3590bd" } # cy
desc = { fg = "#718994", italic = true } # tx-3
hovered = { bg = "#262933" } # ui
footer = { fg = "#111316", bg = "#3590bd", bold = true } # bg, cy

[filetype]
rules = [
  # Empty files
  { mime = "inode/empty", fg = "#718994" }, # tx-3

  # Special files
  { url = "*", is = "orphan", fg = "#718994" }, # tx-3
  { url = "*/", is = "orphan", fg = "#718994" }, # tx-3
  { url = "*", is = "link", fg = "#3590bd" }, # cy
  { url = "*/", is = "link", fg = "#3590bd" }, # cy
  { url = "*", is = "block", fg = "#DFE5EA" }, # tx
  { url = "*", is = "char", fg = "#DFE5EA" }, # tx
  { url = "*", is = "fifo", fg = "#4C3A3B" }, # ma
  { url = "*", is = "sock", fg = "#4C3A3B" }, # ma
  { url = "*", is = "sticky", fg = "#DFE5EA" }, # tx
  { url = "*", is = "dummy", fg = "#718994" }, # tx-3

  # Fallback
  { url = "*/", fg = "#DFE5EA" }, # tx
  { url = "*", is = "exec", fg = "#3590bd" }, # gr
  { url = "*", fg = "#B0BFCB" } # tx-2
]

[icon]
dirs = [
  { name = ".config", text = "", fg = "#3590bd" }, # cy
  { name = ".git", text = "", fg = "#3590bd" }, # cy
  { name = ".github", text = "", fg = "#3590bd" }, # cy
  { name = ".npm", text = "", fg = "#3590bd" }, # cy
  { name = "Desktop", text = "", fg = "#3590bd" }, # cy
  { name = "Development", text = "", fg = "#3590bd" }, # cy
  { name = "Documents", text = "", fg = "#3590bd" }, # cy
  { name = "Downloads", text = "", fg = "#3590bd" }, # cy
  { name = "Library", text = "", fg = "#3590bd" }, # cy
  { name = "Movies", text = "", fg = "#3590bd" }, # cy
  { name = "Music", text = "", fg = "#3590bd" }, # cy
  { name = "Pictures", text = "", fg = "#3590bd" }, # cy
  { name = "Public", text = "", fg = "#3590bd" }, # cy
  { name = "Videos", text = "", fg = "#3590bd" } # cy
]
conds = [
  # Special files
  { if = "orphan", text = "", fg = "#718994" }, # tx-3
  { if = "link", text = "", fg = "#3590bd" }, # cy
  { if = "block", text = "", fg = "#DFE5EA" }, # tx
  { if = "char", text = "", fg = "#DFE5EA" }, # tx
  { if = "fifo", text = "", fg = "#4C3A3B" }, # ma
  { if = "sock", text = "", fg = "#4C3A3B" }, # ma
  { if = "sticky", text = "", fg = "#DFE5EA" }, # tx
  { if = "dummy", text = "", fg = "#718994" }, # tx-3

  # Fallback
  { if = "dir", text = "", fg = "#3590bd" }, # cy
  { if = "exec", text = "", fg = "#3590bd" }, # gr
  { if = "!dir", text = "", fg = "#B0BFCB" } # tx-2
]