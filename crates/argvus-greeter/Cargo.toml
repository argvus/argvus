[package]
# The package exposes one intentionally narrow executable: the greetd-facing
# TUI login process installed as /usr/lib/argvus/commands/greeter.
name = "argvus-greeter"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Keyboard-first TUI greetd greeter for the ARGVUS desktop"
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[[bin]]
name = "argvus-greeter"
path = "src/main.rs"

[dependencies]
# anyhow is used at process boundaries where contextual startup errors are more
# useful than exposing a long chain of low-level error types.
anyhow = "1.0.100"
# Shared ARGVUS crates keep translations, theme resolution, and image protocol
# behavior consistent with the rest of the desktop.
argvus-i18n = { package = "argvus-i18n-core", path = "../argvus-i18n-core" }
argvus-system.workspace = true
argvus-theme = { path = "../argvus-theme" }
argvus-tui = { path = "../argvus-tui" }
crossterm = "0.29"
greetd_ipc = { version = "0.10.3", features = ["sync-codec"] }
libc = "0.2"
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
shlex = "2.0.1"
thiserror = "2.0.17"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
toml = "0.9.8"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
zbus = { version = "5.12.0", default-features = false, features = ["async-io", "blocking-api"] }
