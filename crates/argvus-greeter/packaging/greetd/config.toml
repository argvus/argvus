# greetd starts a dedicated compositor session rather than launching the TUI
# directly on the virtual terminal. This keeps Wayland/Kitty initialization
# isolated from the user's authenticated desktop.
[general]
# Sessions chosen in the greeter must start exactly as their desktop file
# declares. With source_profile enabled, greetd runs each session through the
# user's login shell, so a ~/.zprofile or ~/.profile that starts a TTY launcher
# on VT1 (for example `exec argvus tty`) replaces the selected desktop.
source_profile = false

[terminal]
# VT1 is the conventional boot/login VT; installations can override this file
# before enabling greetd when another VT is required.
vt = 1

[default_session]
# The unprivileged greeter account limits the pre-authentication process.
command = "/usr/lib/argvus/commands/greeter-session"
user = "greeter"
