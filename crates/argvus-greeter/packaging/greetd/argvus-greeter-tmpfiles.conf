# The greeter and the authenticated user need a shared rendezvous directory
# for the DRM handoff socket and the greeter log. The sticky bit (1777) lets
# any user create entries here, but only the owner of an entry (or root) can
# remove or rename it, so one local user cannot replace another's files.
# The socket itself is recreated per login.
d /run/argvus-greeter 1777 root root -
