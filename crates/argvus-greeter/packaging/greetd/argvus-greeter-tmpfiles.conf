# Rendezvous directory between the greeter and the session that logs in: the
# greeter (user `greeter`) writes its log and the DRM handoff socket here; the
# session reads the log and connects to the socket. Only the greeter writes,
# so the directory belongs to it and no other user can create, replace or
# squat entries. The socket itself is recreated per login.
d /run/argvus-greeter 0755 greeter greeter -
