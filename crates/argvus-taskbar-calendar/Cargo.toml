[package]
name = "argvus-taskbar-calendar"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"

[[bin]]
name = "argvus-taskbar-calendar"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde", "clock"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.6", features = ["derive"] }
env_logger = "0.11.8"
futures-util = "0.3.31"
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_12"] }
gtk4-layer-shell = "0.8.1"
icalendar = { version = "0.17.13", features = ["chrono-tz", "recurrence"] }
log = "0.4.28"
notify-rust = "4.18.0"
quick-xml = "0.41.0"
relm4 = "0.11.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "charset"] }
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
secret-service = { version = "5.1.0", default-features = false, features = ["rt-tokio-crypto-rust"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "0.9.8"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
xdg = "3.0.0"
