[package]
name = "argvus-control-center-services"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
argvus-control-center-core = { workspace = true }
argvus-i18n.workspace = true
argvus-theme.workspace = true
argvus-tui.workspace = true
rayon.workspace = true
ratatui.workspace = true
crossterm.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
# Test builds never start external programs (see the core `testing` feature).
argvus-control-center-core = { workspace = true, features = ["testing"] }
