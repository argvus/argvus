[package]
name = "argvus-config"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Canonical ARGVUS user configuration model and command-line interface"

[lib]
name = "argvus_config_core"
path = "src/lib.rs"

[[bin]]
name = "argvus-config"
path = "src/main.rs"

[dependencies]
argvus-loading-theme-core.workspace = true
argvus-theme-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
regex = "1"
chrono.workspace = true

[dev-dependencies]
chrono-tz.workspace = true
