[package]
name = "argvus-control-center-appearance"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
argvus-control-center-core = { workspace = true }
argvus-i18n.workspace = true
argvus-theme.workspace = true
argvus-tui.workspace = true
ratatui.workspace = true
crossterm.workspace = true
flate2 = "1.1"
sha2 = "0.10"
serde_json = { workspace = true, features = ["preserve_order"] }
serde.workspace = true
toml.workspace = true
tar = "0.4"
tempfile = "3.27"
time = { version = "0.3", features = ["local-offset", "formatting"] }

[dev-dependencies]
# Test builds never start external programs (see the core `testing` feature).
argvus-control-center-core = { workspace = true, features = ["testing"] }
