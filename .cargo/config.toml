# Processes started by cargo (`cargo test`, `cargo run`) read the i18n catalogs
# of this tree instead of the installed ones in /usr/share/argvus/i18n, so new
# keys work before the package is installed. An ARGVUS_I18N_DIR already set in
# the environment wins.
[env]
ARGVUS_I18N_DIR = { value = "resources/locales", relative = true }
# The same for the sounds and application icons of ARGVUS Focus and ARGVUS Clock,
# which the package installs in /usr/share/argvus/sounds and /usr/share/icons.
ARGVUS_SOUNDS_DIR = { value = "packaging/archlinux/src/usr/share/argvus/sounds", relative = true }
ARGVUS_ICONS_DIR = { value = "packaging/archlinux/src/usr/share/icons", relative = true }
