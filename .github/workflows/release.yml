name: Arch package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (for example v0.1.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: argvus-release
  cancel-in-progress: false

jobs:
  package:
    name: Build and publish Arch packages
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write

    steps:
      - name: Install packaging tools
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git gnupg pacman-contrib rust gtk4 gtk4-layer-shell \
            libdrm namcap shellcheck sudo

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare build user
        run: |
          useradd --create-home --shell /bin/bash builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' >/etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Prepare package version
        id: version
        shell: bash
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          version="${TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*([._+-][A-Za-z0-9]+)*$ ]]; then
            echo "Unsupported version tag: ${TAG}" >&2
            exit 1
          fi

          # The package builds the tag tarball, so the tag must match the version the
          # sources declare. Bump [workspace.package] before tagging; the greeter
          # inherits that version from the root workspace.
          workspace_version="$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$workspace_version" != "$version" ]]; then
            echo "Tag ${TAG} does not match the declared version ${workspace_version}" >&2
            exit 1
          fi

          sed -i "s/^pkgver=.*/pkgver=${version}/" "packaging/arch/remote/PKGBUILD"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Fill PKGBUILD checksums
        shell: bash
        run: |
          set -euo pipefail
          sudo -u builder env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" HOME=/home/builder bash -lc 'cd "$GITHUB_WORKSPACE/packaging/arch/remote" && updpkgsums'

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          if make -n validate >/dev/null 2>&1; then
            make validate
          else
            echo "No make validate target; skipping repository validation."
          fi

      - name: Build packages
        shell: bash
        run: |
          set -euo pipefail

          sudo -u builder env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash -lc             'cd "$GITHUB_WORKSPACE/packaging/arch/remote" && makepkg --nodeps --noconfirm --needed --cleanbuild --clean'

          # The PKGBUILD (pkgname argvus) produces one package that carries the
          # command, the GTK 4 helpers and the login greeter.
          mapfile -t pkg_files < <(find "packaging/arch/remote" -maxdepth 1 -type f -name 'argvus*.pkg.tar.zst' | sort)
          if [[ "${#pkg_files[@]}" -ne 1 ]]; then
            printf 'Expected 1 package, found %s:\n' "${#pkg_files[@]}" >&2
            printf '  %s\n' "${pkg_files[@]}" >&2
            exit 1
          fi

          printf '%s\n' "${pkg_files[@]}" > "$RUNNER_TEMP/argvus-packages.txt"

      - name: Sign packages
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail

          [ -n "${GPG_PRIVATE_KEY:-}" ] || { echo "::error::GPG_PRIVATE_KEY secret is not set"; exit 1; }
          [ -n "${GPG_PASSPHRASE:-}" ] || { echo "::error::GPG_PASSPHRASE secret is not set"; exit 1; }
          [ -n "${GPG_KEY_ID:-}" ] || { echo "::error::GPG_KEY_ID secret is not set"; exit 1; }

          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"

          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          IMPORTED_GPG_KEY_ID="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^sec:/ { print $5; exit }')"
          [ -n "$IMPORTED_GPG_KEY_ID" ] || { echo "::error::No secret GPG key was imported"; exit 1; }
          IMPORTED_GPG_FINGERPRINT="$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')"
          [ "$IMPORTED_GPG_KEY_ID" = "$GPG_KEY_ID" ] || [ "$IMPORTED_GPG_FINGERPRINT" = "$GPG_KEY_ID" ] || { echo "::error::Imported GPG key does not match GPG_KEY_ID"; exit 1; }

          mapfile -t pkg_files < "$RUNNER_TEMP/argvus-packages.txt"
          for pkg_file in "${pkg_files[@]}"; do
            rm -f "${pkg_file}.sig"
            printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --local-user "$GPG_KEY_ID" --detach-sign "$pkg_file"
          done

      - name: Verify package signatures
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          [ -n "${GPG_PRIVATE_KEY:-}" ] || { echo "::error::GPG_PRIVATE_KEY secret is not set"; exit 1; }

          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

          mapfile -t pkg_files < "$RUNNER_TEMP/argvus-packages.txt"
          for pkg_file in "${pkg_files[@]}"; do
            gpg --batch --verify "${pkg_file}.sig" "$pkg_file"
          done

      - name: Upload temporary package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: argvus-packages-${{ steps.version.outputs.version }}
          path: |
            packaging/arch/remote/argvus*.pkg.tar.zst
            packaging/arch/remote/argvus*.pkg.tar.zst.sig
          if-no-files-found: error
          retention-days: 1

      - name: Checkout packages repository
        uses: actions/checkout@v4
        with:
          repository: argvus/packages
          path: packages-repo
          token: ${{ secrets.PACKAGES_REPO_TOKEN }}

      - name: Publish packages to argvus/packages
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail

          [ -n "${GPG_PRIVATE_KEY:-}" ] || { echo "::error::GPG_PRIVATE_KEY secret is not set"; exit 1; }
          [ -n "${GPG_PASSPHRASE:-}" ] || { echo "::error::GPG_PASSPHRASE secret is not set"; exit 1; }
          [ -n "${GPG_KEY_ID:-}" ] || { echo "::error::GPG_KEY_ID secret is not set"; exit 1; }

          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          IMPORTED_GPG_KEY_ID="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^sec:/ { print $5; exit }')"
          [ -n "$IMPORTED_GPG_KEY_ID" ] || { echo "::error::No secret GPG key was imported"; exit 1; }
          IMPORTED_GPG_FINGERPRINT="$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')"
          [ "$IMPORTED_GPG_KEY_ID" = "$GPG_KEY_ID" ] || [ "$IMPORTED_GPG_FINGERPRINT" = "$GPG_KEY_ID" ] || { echo "::error::Imported GPG key does not match GPG_KEY_ID"; exit 1; }

          gpg_sign() {
            local target="$1"
            rm -f "${target}.sig"
            printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --local-user "$GPG_KEY_ID" --detach-sign "$target"
          }

          repo_dir="$GITHUB_WORKSPACE/packages-repo/public/arch/x86_64"
          mkdir -p "$repo_dir"

          mapfile -t pkg_files < "$RUNNER_TEMP/argvus-packages.txt"
          pkg_names=()
          for pkg_file in "${pkg_files[@]}"; do
            pkg_name="$(basename "$pkg_file")"
            pkg_names+=("$pkg_name")
            cp "$GITHUB_WORKSPACE/$pkg_file" "$repo_dir/$pkg_name"
            cp "$GITHUB_WORKSPACE/$pkg_file.sig" "$repo_dir/$pkg_name.sig"
          done

          cd "$repo_dir"
          repo-add -R argvus.db.tar.gz "${pkg_names[@]}"
          gpg_sign argvus.db.tar.gz
          gpg_sign argvus.files.tar.gz
          gpg_sign argvus.db
          gpg_sign argvus.files

          cd "$GITHUB_WORKSPACE/packages-repo"
          git config --global --add safe.directory "$PWD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/arch/x86_64

          if git diff --cached --quiet -- public/arch/x86_64; then
            echo "No package repository changes to publish."
            exit 0
          fi

          git commit -m "Publish argvus ${{ steps.version.outputs.version }}"
          git push

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            packaging/arch/remote/argvus*.pkg.tar.zst
            packaging/arch/remote/argvus*.pkg.tar.zst.sig
