name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate package sources
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install validation tools
        run: |
          pacman -Syu --noconfirm --needed             base-devel             git             pkgconf             rust             gtk4             gtk4-layer-shell             shellcheck             sudo

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          if make -n validate >/dev/null 2>&1; then
            make validate
          else
            echo "No make validate target; skipping repository validation."
          fi

      - name: Validate remote PKGBUILD
        shell: bash
        run: |
          set -euo pipefail
          cd "packaging/archlinux/pkgbuilds/remote"
          makepkg -p PKGBUILD --printsrcinfo >/dev/null

      - name: Validate local PKGBUILD
        shell: bash
        run: |
          set -euo pipefail
          cd "packaging/archlinux/pkgbuilds/local"
          makepkg -p PKGBUILD --printsrcinfo >/dev/null
