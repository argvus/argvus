[package]
name = "argvus-about"
version = "0.4.0"
edition = "2024"
description = "About dialog for the ARGVUS desktop environment"
license = "GPL-3.0-only"
repository = "https://github.com/argvus/argvus"

[[bin]]
name = "argvus-about"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_12"] }

[profile.release]
strip = true
